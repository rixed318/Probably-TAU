name: Core .NET 8 golden tests

on:
  push:
    branches: [feature/core-2]
  pull_request:
    paths:
      - 'Runtime/Core/**'
      - 'Tests/Core/**'
      - '.github/workflows/core-dotnet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-golden:
    name: Compile Core and run three golden suites (.NET 8; not Unity)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout actual branch sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile and run all Core golden suites
        run: dotnet run --project Tests/Core/Standalone/TAU.Core.GoldenRunner.csproj --configuration Release
