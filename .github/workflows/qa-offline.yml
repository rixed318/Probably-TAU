name: QA offline regression

on:
  push:
    branches: [feature/save-6]
  pull_request:
    paths:
      - 'Tests/QA/**'
      - 'Runtime/Core/Pcg32.cs'
      - '.github/workflows/qa-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pcg32-oracle:
    name: Python PCG32 oracle (not C# or Unity)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python syntax check
        run: python3 -m py_compile Tests/QA/test_pcg32_contract.py
      - name: Independent reference tests
        run: python3 Tests/QA/test_pcg32_contract.py
      - name: Checkout actual Core branch read-only
        uses: actions/checkout@v4
        with:
          ref: feature/core-2
          path: core-source
          persist-credentials: false
      - name: Record actual Core revision
        run: git -C core-source rev-parse HEAD
      - name: Audit real Core C# PCG32 source (not C# execution)
        run: python3 Tests/QA/test_pcg32_contract.py --core-source core-source/Runtime/Core/Pcg32.cs

  cross-branch-offline:
    name: UI and Content static regression (not integration)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout UI branch read-only
        uses: actions/checkout@v4
        with:
          ref: feature/ui-5
          path: ui
          persist-credentials: false
      - name: Checkout Content branch read-only
        uses: actions/checkout@v4
        with:
          ref: feature/content-7
          path: content
          persist-credentials: false
      - name: Record exact source revisions
        shell: bash
        run: |
          echo "UI_SHA=$(git -C ui rev-parse HEAD)"
          echo "CONTENT_SHA=$(git -C content rev-parse HEAD)"
      - name: UI Node mock regression
        run: node --test prototypes/ui-day-one/test-fixtures.cjs
        working-directory: ui
      - name: UI art manifest validation
        run: python3 tools/art/validate_manifest.py
        working-directory: ui
      - name: UI art validator unit tests
        run: python3 -m unittest discover -s tools/art -p 'test_validate_manifest.py' -v
        working-directory: ui
      - name: Content typed event hooks validation
        run: node Content/validate-event-hooks.cjs
        working-directory: content
      - name: Content cross-file consistency validation
        run: node Content/validate-content-consistency.cjs
        working-directory: content
