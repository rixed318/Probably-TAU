name: QA offline regression

on:
  push:
    branches: [feature/save-6]
  pull_request:
    paths:
      - 'Tests/QA/**'
      - 'Runtime/Core/Pcg32.cs'
      - '.github/workflows/qa-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pcg32-oracle:
    name: Python PCG32 oracle (not C# or Unity)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python syntax check
        run: python3 -m py_compile Tests/QA/test_pcg32_contract.py
      - name: Independent reference tests
        run: python3 Tests/QA/test_pcg32_contract.py
      - name: Checkout actual Core branch read-only
        uses: actions/checkout@v4
        with:
          ref: 0f5a85ef1136fec0cbc0285568b11985f0e7200c
          path: core-source
          persist-credentials: false
      - name: Record actual Core revision
        run: |
          actual=$(git -C core-source rev-parse HEAD)
          echo "CORE_ORACLE_SHA=$actual"
          test "$actual" = "0f5a85ef1136fec0cbc0285568b11985f0e7200c"
      - name: Audit real Core C# PCG32 source (not C# execution)
        run: python3 Tests/QA/test_pcg32_contract.py --core-source core-source/Runtime/Core/Pcg32.cs

  cross-branch-offline:
    name: UI and Content static regression (not integration)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout UI branch read-only
        uses: actions/checkout@v4
        with:
          ref: cc44bf037f2aad91c41718ec2f3f336b7a0cd464
          path: ui
          persist-credentials: false
      - name: Checkout Content branch read-only
        uses: actions/checkout@v4
        with:
          ref: f3d9950e9e607176e28e0af70abc6bb9566555be
          path: content
          persist-credentials: false
      - name: Record exact source revisions
        shell: bash
        run: |
          ui_sha=$(git -C ui rev-parse HEAD)
          echo "UI_SHA=$ui_sha"
          test "$ui_sha" = "cc44bf037f2aad91c41718ec2f3f336b7a0cd464"
          content_sha=$(git -C content rev-parse HEAD)
          echo "CONTENT_SHA=$content_sha"
          test "$content_sha" = "f3d9950e9e607176e28e0af70abc6bb9566555be"
      - name: UI Node mock regression
        run: node --test prototypes/ui-day-one/test-fixtures.cjs
        working-directory: ui
      - name: UI canonical Day 01 read-model regression
        run: node --test prototypes/ui-day-one/test-day01-read-model.cjs
        working-directory: ui
      - name: UI canonical Day 01 preview regression
        run: node --test prototypes/ui-day-one/test-day01-preview.cjs
        working-directory: ui
      - name: UI playable Day 01 gameplay gateway regression (Issue #18, not browser launch)
        run: node --test prototypes/ui-day-one/test-day01-gameplay.cjs
        working-directory: ui
      - name: UI art manifest validation
        run: python3 tools/art/validate_manifest.py
        working-directory: ui
      - name: UI art validator unit tests
        run: python3 -m unittest discover -s tools/art -p 'test_validate_manifest.py' -v
        working-directory: ui
      - name: Content typed event hooks validation
        run: node Content/validate-event-hooks.cjs
        working-directory: content
      - name: Content cross-file consistency validation
        run: node Content/validate-content-consistency.cjs
        working-directory: content
      - name: Content canonical money wire validation
        run: node Content/validate-money-wire.cjs
        working-directory: content

  core-ledger-regression:
    name: Core ledger and snapshot .NET 8 regression (not Unity)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout actual Core branch read-only
        uses: actions/checkout@v4
        with:
          ref: 0f5a85ef1136fec0cbc0285568b11985f0e7200c
          path: core
          persist-credentials: false
      - name: Record exact Core revision
        run: |
          actual=$(git -C core rev-parse HEAD)
          echo "CORE_SHA=$actual"
          test "$actual" = "0f5a85ef1136fec0cbc0285568b11985f0e7200c"
      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile and execute Core golden suites including Ledger
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project Tests/Core/Standalone/TAU.Core.GoldenRunner.csproj --configuration Release | tee core-golden.log
          # Fail closed if a Core refactor silently drops the fifth suite from the runner.
          grep -Fx 'PASS: Financial command atomic prepare/commit and replay' core-golden.log
          grep -Fx 'PASS: all 5 Core golden suites.' core-golden.log

  npc-conditions-regression:
    name: NPC standalone .NET 8 regression (not Unity)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout NPC branch read-only
        uses: actions/checkout@v4
        with:
          ref: d82bc6ee4bfc82d6bcfcccfd6c84760a5d58761c
          path: npc
          persist-credentials: false
      - name: Record actual NPC revision
        run: |
          actual=$(git -C npc rev-parse HEAD)
          echo "NPC_SHA=$actual"
          test "$actual" = "d82bc6ee4bfc82d6bcfcccfd6c84760a5d58761c"
      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile and run NPC golden assertions
        working-directory: npc
        run: dotnet run --project Tests/Npc/Standalone/NpcConditionGolden.csproj --configuration Release
